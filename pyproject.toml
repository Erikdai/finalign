[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["data", "out", "results", "logs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM"]
# E402: entry scripts put the repository root on sys.path before importing project modules.
# E731: question templates in the QA builder are short lambdas. B905: zipped sequences have equal length by construction.
ignore = ["E501", "E402", "E731", "B905"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
# Copied unchanged from MiniMind.
"model/model_minimind.py" = ["E", "W", "F", "I", "B", "UP", "C4", "SIM"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["data_pipeline", "dataset", "evaluation", "model", "rag", "scripts", "trainer"]

[tool.pyright]
extraPaths = ["."]
reportMissingImports = "warning"
